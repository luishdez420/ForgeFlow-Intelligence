name: Pilot release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      confirmation:
        description: Type DEPLOY to authorize this manual release
        required: true
        type: string
      migration_failure_drill:
        description: "Staging only: intentionally fail the migration before services change"
        required: false
        default: false
        type: boolean
      rollback_drill:
        description: "Staging only: update then restore the existing API service revision"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: forgeflow-release-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TARGET_ENV: ${{ inputs.environment }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      DATABASE_SECRET_ARN: ${{ vars.DATABASE_SECRET_ARN }}
      DATABASE_RUNTIME_SECRET_ARN: ${{ vars.DATABASE_RUNTIME_SECRET_ARN }}
      INTERNAL_API_SECRET_ARN: ${{ vars.INTERNAL_API_SECRET_ARN }}
      WEB_AUTH_SECRET_ARN: ${{ vars.WEB_AUTH_SECRET_ARN }}
      GOOGLE_OAUTH_SECRET_ARN: ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
      WEB_APP_ORIGIN: ${{ vars.WEB_APP_ORIGIN }}
      GOOGLE_WORKSPACE_DOMAIN: ${{ vars.GOOGLE_WORKSPACE_DOMAIN }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
      ECS_TASK_EXECUTION_ROLE_ARN: ${{ vars.ECS_TASK_EXECUTION_ROLE_ARN }}
      ECS_TASK_ROLE_ARN: ${{ vars.ECS_TASK_ROLE_ARN }}
      SERVICE_DISCOVERY_NAMESPACE_ARN: ${{ vars.SERVICE_DISCOVERY_NAMESPACE_ARN }}
      MIGRATION_FAILURE_DRILL: ${{ inputs.migration_failure_drill }}
      ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check-containers
      - run: MIGRATION_BASE_REF=origin/main npm run release:check-migrations
      - name: Validate release configuration
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$DATABASE_SECRET_ARN"
          test -n "$DATABASE_RUNTIME_SECRET_ARN"
          test -n "$INTERNAL_API_SECRET_ARN"
          test -n "$WEB_AUTH_SECRET_ARN"
          test -n "$GOOGLE_OAUTH_SECRET_ARN"
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SUBNETS"
          test -n "$ECS_SECURITY_GROUP"
          test -n "$ECS_TASK_EXECUTION_ROLE_ARN"
          test -n "$ECS_TASK_ROLE_ARN"
          test -n "$SERVICE_DISCOVERY_NAMESPACE_ARN"
          if [[ "$MIGRATION_FAILURE_DRILL" == "true" || "$ROLLBACK_DRILL" == "true" ]]; then
            test "$TARGET_ENV" = "staging" || {
              echo "Failure and rollback drills are restricted to staging." >&2
              exit 1
            }
          fi
          if [[ "$MIGRATION_FAILURE_DRILL" == "true" && "$ROLLBACK_DRILL" == "true" ]]; then
            echo "Choose only one release drill at a time." >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-api:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - id: build-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-web:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - id: build-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: true
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-worker:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run compatibility-checked migration
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-api@${{ steps.build-api.outputs.digest }}
        run: |
          node scripts/render-task-definition.mjs \
            deploy/task-definitions/migration.json > migration-task.json
          task_definition=$(aws ecs register-task-definition --cli-input-json file://migration-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          migration_overrides=()
          if [[ "$MIGRATION_FAILURE_DRILL" == "true" ]]; then
            echo "Starting the expected staging migration-failure drill; services will not be updated."
            migration_overrides=(--overrides '{"containerOverrides":[{"name":"migration","command":["node","-e","process.exit(42)"]}]}')
          fi
          task_arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$task_definition" "${migration_overrides[@]}" --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            task_id="${task_arn##*/}"
            echo "Migration task stopped with exit code $exit_code."
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}' --output json || true
            aws logs get-log-events --log-group-name "/forgeflow/${TARGET_ENV}/migration" --log-stream-name "ecs/migration/${task_id}" --start-from-head --query 'events[].message' --output text || true
            exit 1
          fi
      - name: Bootstrap constrained application database role
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-api@${{ steps.build-api.outputs.digest }}
        run: |
          node scripts/render-task-definition.mjs \
            deploy/task-definitions/database-role-bootstrap.json > database-role-bootstrap-task.json
          task_definition=$(aws ecs register-task-definition --cli-input-json file://database-role-bootstrap-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          task_arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$task_definition" --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            task_id="${task_arn##*/}"
            echo "Database-role bootstrap stopped with exit code $exit_code."
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}' --output json || true
            aws logs get-log-events --log-group-name "/forgeflow/${TARGET_ENV}/database-role-bootstrap" --log-stream-name "ecs/database-role-bootstrap/${task_id}" --start-from-head --query 'events[].message' --output text || true
            exit 1
          fi
      - name: Verify constrained runtime database access
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-api@${{ steps.build-api.outputs.digest }}
        run: |
          node scripts/render-task-definition.mjs \
            deploy/task-definitions/database-runtime-smoke.json > database-runtime-smoke-task.json
          task_definition=$(aws ecs register-task-definition --cli-input-json file://database-runtime-smoke-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          task_arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$task_definition" --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=DISABLED}" --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            task_id="${task_arn##*/}"
            echo "Runtime database smoke stopped with exit code $exit_code."
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn" --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,reason:reason,exitCode:exitCode}}' --output json || true
            aws logs get-log-events --log-group-name "/forgeflow/${TARGET_ENV}/database-role-bootstrap" --log-stream-name "ecs/database-runtime-smoke/${task_id}" --start-from-head --query 'events[].message' --output text || true
            exit 1
          fi
      - name: Deploy service revisions with rollback
        env:
          API_IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-api@${{ steps.build-api.outputs.digest }}
          WEB_IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-web@${{ steps.build-web.outputs.digest }}
          WORKER_IMAGE_URI: ${{ steps.ecr.outputs.registry }}/forgeflow-${{ inputs.environment }}-worker@${{ steps.build-worker.outputs.digest }}
          ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
        run: bash scripts/deploy-ecs-services.sh
