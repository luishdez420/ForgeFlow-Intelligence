[project]
name = "forgeflow-worker"
version = "0.1.0"
description = "Durable workflow worker runtime for ForgeFlow Intelligence."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
